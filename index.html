<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Portfolio - Character Selection</title>
    <!-- Retro Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="crt-overlay"></div>

    <div class="arcade-container">
        <!-- Arcade Header -->
        <header class="arcade-header">
            <h1 class="blink-title">SELECT YOUR DEVELOPER</h1>
            <p class="subtitle">PRESS ARROWS / A-D TO NAVIGATE • ENTER / CLICK TO SELECT</p>
        </header>

        <!-- 5-Character Grid -->
        <main class="character-grid" id="character-grid">
            <!-- Cards generated dynamically via JavaScript -->
        </main>

        <!-- Selected Character Stats & Info Panel -->
        <section class="character-detail-panel" id="detail-panel">
            <div class="panel-header">
                <span class="p1-indicator">P1 READY</span>
                <h2 id="selected-name">MEMBER NAME</h2>
                <span class="role-badge" id="selected-role">CLASS ROLE</span>
            </div>
            
            <div class="panel-body">
                <div class="stats-container" id="selected-stats">
                    <!-- Dynamic OOP Stats Rendered Here -->
                </div>
                <div class="action-container">
                    <button id="select-btn" class="arcade-btn">
                        <i class="fa-solid fa-gamepad"></i> START MISSION
                    </button>
                </div>
            </div>
        </section>
    </div>

    <!-- Modular JS Scripts (ES Modules) -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
